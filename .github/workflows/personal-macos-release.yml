name: Tangent macOS Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: personal-macos-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - id: meta
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          tags_file="$RUNNER_TEMP/personal-release-tags"
          git tag --list 'personal-v*' > "$tags_file"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' >> "$tags_file"
          version="$(node scripts/personal-release-version.ts "$DISPATCH_VERSION" "$(cat "$tags_file")")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=personal-v$version" >> "$GITHUB_OUTPUT"

  cli-archives:
    name: Server (${{ matrix.resource_key }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: personal-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              runner: macos-latest,
              platform: mac,
              arch: arm64,
              target: aarch64-apple-darwin,
              resource_key: darwin-arm64,
            }
          - {
              runner: ubuntu-latest,
              platform: linux,
              arch: x64,
              target: x86_64-unknown-linux-gnu,
              resource_key: linux-x64,
            }
          - {
              runner: ubuntu-24.04-arm,
              platform: linux,
              arch: arm64,
              target: aarch64-unknown-linux-gnu,
              resource_key: linux-arm64,
            }
          - {
              runner: windows-latest,
              platform: win,
              arch: x64,
              target: x86_64-pc-windows-msvc,
              resource_key: win32-x64,
            }
          - {
              runner: windows-11-arm,
              platform: win,
              arch: arm64,
              target: aarch64-pc-windows-msvc,
              resource_key: win32-arm64,
            }
    steps:
      # Follow upstream's archive checkout: vendored gitlinks and long paths are
      # unnecessary for packaging and break checkout cleanup on release runners.
      - name: Checkout
        shell: bash
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: ${{ matrix.platform != 'win' }}
          run-install: false
      - name: Install Spectre-mitigated MSVC libs
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.${{ matrix.arch == 'arm64' && 'ARM64' || 'x86.x64' }}.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Install release dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"
      - name: Build server and client
        run: vp run --filter t3 build
      - name: Build server executable
        env:
          VP_NODE_VERSION: "26.8.2"
        run: node apps/server/scripts/cli.ts build-exe --verbose
      - name: Build resource monitor
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target ${{ matrix.target }}
      - name: Import macOS signing certificate for the CLI archive
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" ]]; then
            echo "Tangent macOS CLI signing requires CSC_LINK and CSC_KEY_PASSWORD." >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/t3-cli-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          cert_path="$RUNNER_TEMP/t3-cli-signing.p12"
          printf '%s' "$CSC_LINK" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert_path" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          keychains=()
          while IFS= read -r existing_keychain; do
            keychains+=("$existing_keychain")
          done < <(security list-keychains -d user | sed 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "No Developer ID Application identity found in CSC_LINK." >&2
            exit 1
          fi
          echo "::add-mask::$keychain_password"
          echo "T3CODE_CLI_MAC_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "macOS CLI signing enabled."

      - name: Stage resource monitor
        shell: bash
        run: |
          binary=t3-resource-monitor
          if [[ "${{ matrix.platform }}" == win ]]; then binary="$binary.exe"; fi
          target_dir="$RUNNER_TEMP/cli-resource-monitor/${{ matrix.resource_key }}"
          mkdir -p "$target_dir"
          cp "native/resource-monitor/target/${{ matrix.target }}/release/$binary" "$target_dir/"
      - name: Package standalone server
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [[ "${{ matrix.platform }}" == mac ]]; then
            test -n "$APPLE_API_KEY"
            key_path="$RUNNER_TEMP/AuthKey_cli_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY" > "$key_path"
            export APPLE_API_KEY="$key_path"
          fi
          node scripts/build-cli-archive.ts \
            --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" \
            --version "${{ needs.preflight.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli
      - name: Smoke-test standalone server
        shell: bash
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.preflight.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.resource_key }}
          path: release-cli/*
          if-no-files-found: error

  release:
    name: Build and publish macOS arm64
    needs: [preflight, cli-archives]
    runs-on: macos-latest
    timeout-minutes: 60
    environment: personal-release
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Check
        run: vp check

      - name: Typecheck
        run: vp run typecheck

      - name: Test
        env:
          TMPDIR: ${{ runner.temp }}
        run: vp run test

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Prepare Apple signing
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          required=(CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER)
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Build signed and notarized DMG
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch arm64 \
            --build-version "${{ needs.preflight.outputs.version }}" \
            --signed \
            --verbose

      - name: Collect release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          mkdir -p release-publish
          for suffix in dmg dmg.blockmap zip zip.blockmap; do
            asset="release/tangent-$RELEASE_VERSION-arm64.$suffix"
            test -s "$asset"
            cp "$asset" release-publish/
          done
          test -s release/latest-mac.yml
          cp release/latest-mac.yml release-publish/

      - name: Download standalone server archives
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: release-publish
          merge-multiple: true

      - name: Verify release assets and write checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          cd release-publish
          for platform in darwin-arm64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            extension=tar.gz
            if [[ "$platform" == win32-* ]]; then extension=zip; fi
            test -s "tangent-server-$RELEASE_VERSION-$platform.$extension"
          done
          shasum -a 256 tangent-server-*.tar.gz tangent-server-*.zip > SHA256SUMS

      - name: Upload draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" release-publish/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Tangent v$RELEASE_VERSION" --generate-notes --draft

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
