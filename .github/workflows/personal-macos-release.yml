name: Tangent macOS Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: personal-macos-release
  cancel-in-progress: false

jobs:
  resource-monitor:
    name: Resource monitor (${{ matrix.resource_key }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            resource_key: darwin-arm64
          - runner: macos-latest
            target: x86_64-apple-darwin
            resource_key: darwin-x64
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            resource_key: win32-x64
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build resource monitor
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target ${{ matrix.target }}
      - name: Collect resource monitor
        shell: bash
        env:
          RESOURCE_KEY: ${{ matrix.resource_key }}
        run: |
          binary=t3-resource-monitor
          if [[ "$RESOURCE_KEY" == win32-* ]]; then binary="$binary.exe"; fi
          target_dir="resource-monitor-publish/$RESOURCE_KEY"
          mkdir -p "$target_dir"
          cp "native/resource-monitor/target/${{ matrix.target }}/release/$binary" "$target_dir/"
      - uses: actions/upload-artifact@v7
        with:
          name: resource-monitor-${{ matrix.resource_key }}
          path: resource-monitor-publish/
          if-no-files-found: error

  release:
    name: Build and publish macOS arm64
    needs: resource-monitor
    runs-on: macos-latest
    timeout-minutes: 60
    environment: personal-release
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - id: release-meta
        name: Resolve personal release version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Personal releases must run from main." >&2
            exit 1
          fi
          tags_file="$RUNNER_TEMP/personal-release-tags"
          git tag --list 'personal-v*' > "$tags_file"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' >> "$tags_file"
          version="$(node scripts/personal-release-version.ts "$DISPATCH_VERSION" "$(cat "$tags_file")")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=personal-v$version" >> "$GITHUB_OUTPUT"

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Check
        run: vp check

      - name: Typecheck
        run: vp run typecheck

      - name: Test
        run: vp run test

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ steps.release-meta.outputs.version }}"

      - name: Prepare Apple signing
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          required=(CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER)
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Build signed and notarized DMG
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch arm64 \
            --build-version "${{ steps.release-meta.outputs.version }}" \
            --signed \
            --verbose

      - name: Collect release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release-meta.outputs.version }}
        run: |
          mkdir -p release-publish
          for suffix in dmg dmg.blockmap zip zip.blockmap; do
            asset="release/tangent-$RELEASE_VERSION-arm64.$suffix"
            test -s "$asset"
            cp "$asset" release-publish/
          done
          test -s release/latest-mac.yml
          cp release/latest-mac.yml release-publish/

      - name: Download server resource monitors
        uses: actions/download-artifact@v8
        with:
          pattern: resource-monitor-*
          path: apps/server/dist/resource-monitor
          merge-multiple: true

      - name: Pack Tangent server release
        shell: bash
        run: |
          version="${{ steps.release-meta.outputs.version }}"
          chmod +x apps/server/dist/resource-monitor/*/t3-resource-monitor
          node apps/server/scripts/cli.ts pack \
            --output-directory release-publish
          source_archive="release-publish/t3-$version.tgz"
          release_archive="release-publish/tangent-server-$version.tgz"
          test -f "$source_archive"
          mv "$source_archive" "$release_archive"
          (
            cd release-publish
            shasum -a 256 "tangent-server-$version.tgz" \
              > "tangent-server-$version.tgz.sha256"
          )

      - name: Upload draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-meta.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release-meta.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" release-publish/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Tangent v$RELEASE_VERSION" --generate-notes --draft

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-meta.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
